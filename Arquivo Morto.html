<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arquivo Morto</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{--desk:#D9DBDE;--paper:#fff;--p2:#F4F5F6;--ink:#25272B;--ink2:#6B6F76;--rule:#E4E7EB;--rule2:#C9CDD3;--y:#F2B705;--hl:#FFF3C4;--danger:#B3261E;--ok:#2F7A68;--warn:#B8650B;--blue:#3B5FB0;
--fd:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--fb:"Instrument Sans","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--desk:#16171A;--paper:#23252A;--p2:#1C1E22;--ink:#ECEDEF;--ink2:#A3A7AE;--rule:#30333A;--rule2:#454952;--y:#F5C431;--hl:#4A3D12;--danger:#F2867E;--ok:#5FC2A8;--warn:#F0A458;--blue:#8FAAF0;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--desk);color:var(--ink);font:15px/1.45 var(--fb)}
header{background:var(--paper);border-bottom:3px solid var(--y);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;position:sticky;top:0;z-index:5}
.brand{font:800 22px var(--fd);letter-spacing:-.02em}.brand small{display:block;font:500 10.5px var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
nav{display:flex;gap:4px;flex-wrap:wrap}nav button{border:0;background:none;font:600 14px var(--fb);color:var(--ink2);padding:8px 12px;border-radius:6px;cursor:pointer}
nav button.on{background:var(--hl);color:var(--ink)}nav button:hover{background:var(--p2)}
.st{margin-left:auto;font-size:12px;color:var(--ink2);display:flex;gap:8px;align-items:center}
main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
h1{font:800 26px var(--fd);margin:0 0 14px}h2{font:700 17px var(--fd);margin:0 0 10px}
.card{background:var(--paper);border-radius:8px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.k{background:var(--paper);border-radius:8px;padding:14px;border-left:5px solid var(--y);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.12);text-align:left;border-top:0;border-right:0;border-bottom:0;font:inherit;color:inherit}
.k b{display:block;font:800 30px var(--fd)}.k span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.in,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--p2);border:1px solid var(--rule2);border-radius:6px;padding:8px 10px}
.in:focus,select:focus,textarea:focus{outline:2px solid var(--y);border-color:var(--y)}
label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:3px}
.g{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:10px}.g.w{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.btn{font:600 14px var(--fb);border:1px solid var(--rule2);background:var(--paper);color:var(--ink);padding:8px 14px;border-radius:6px;cursor:pointer}
.btn:hover{background:var(--p2)}.btn.pri{background:var(--y);border-color:var(--y);color:#25272B}.btn.dng{color:var(--danger);border-color:var(--danger)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}.sp{flex:1}
.tw{overflow-x:auto}table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);padding:8px;border-bottom:2px solid var(--rule2);white-space:nowrap}
.t td{padding:8px;border-bottom:1px solid var(--rule);vertical-align:top}.t tr[data-act]{cursor:pointer}.t tr[data-act]:hover td{background:var(--hl)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.s0{color:var(--ok)}.s1{color:var(--warn)}.s2{color:var(--blue)}.s3{color:var(--ink2)}
.muted{color:var(--ink2);font-size:13px}.empty{color:var(--ink2);padding:18px 0;text-align:center}.err{color:var(--danger);font-weight:600;min-height:1em;margin:6px 0}
.warn{background:var(--hl);border-left:5px solid var(--y);padding:10px 14px;border-radius:6px;margin-bottom:16px}
.ov{position:fixed;inset:0;background:rgba(20,22,26,.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px;z-index:20}
.box{background:var(--paper);border-radius:10px;padding:20px;width:100%;max-width:820px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:0 0 12px}dt{color:var(--ink2);font-size:13px}dd{margin:0}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:8px;z-index:30;max-width:90vw}
@media print{header,.noprint,#toast{display:none!important}body{background:#fff;color:#000}.card{box-shadow:none;padding:0}main{padding:0}}
</style>
</head>
<body>
<header>
  <div class="brand">Arquivo Morto<small>Controle de caixas</small></div>
  <nav id="nav">
    <button data-act="go" data-v="home">Início</button><button data-act="go" data-v="cx">Caixas</button><button data-act="go" data-v="emp">Empresas</button><button data-act="go" data-v="mov">Movimentações</button><button data-act="go" data-v="rep">Relatórios</button>
  </nav>
  <div class="st"><span id="mode">Não conectado</span><button class="btn" data-act="refresh" title="Reler os dados da pasta agora">Atualizar</button></div>
</header>
<main id="main"></main>

<div class="ov" id="cx" hidden><div class="box" style="max-width:520px">
  <h2>Conectar à pasta do Arquivo Morto</h2>
  <p id="cxTxt"></p><p class="err" id="cxErr" role="alert"></p>
  <div class="bar"><span class="sp"></span><button class="btn pri" type="button" id="cxBtn">Escolher a pasta do Arquivo Morto</button></div>
  <p class="muted" id="cxDiag" style="word-break:break-all;font-size:11.5px"></p>
</div></div>
<div class="ov" id="md" hidden><div class="box" id="mdBox"></div></div>
<div id="toast" hidden></div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const pad=n=>String(n).padStart(2,'0'),T=s=>String(s==null?'':s).trim();
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const nowL=()=>{const d=new Date();return today()+'T'+pad(d.getHours())+':'+pad(d.getMinutes());};
const dBR=s=>s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'';
const dtBR=s=>s?dBR(s)+(s.length>10?' '+s.slice(11,16):''):'';
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const SIT=['Armazenada','Retirada','Aguardando entrega','Entregue'];
const TIPOS=['Contabilidade','Fiscal','Financeiro','Entradas','Saídas','Contratos','Administrativo','Outros'];
const MOVS=['Retirada','Devolução','Mudança de localização','Aguardando entrega','Entrega','Outra movimentação'];
const opt=(a,sel,blank)=>(blank!=null?'<option value="">'+blank+'</option>':'')+a.map(x=>'<option'+(x===sel?' selected':'')+'>'+esc(x)+'</option>').join('');
const mask=s=>{s=String(s||'').replace(/[^0-9A-Za-z]/g,'').toUpperCase().slice(0,14);let o='';for(let i=0;i<s.length;i++){if(i===2||i===5)o+='.';if(i===8)o+='/';if(i===12)o+='-';o+=s[i];}return o;};
const toast=m=>{const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>{t.hidden=true;},3400);};

/* ---------- armazenamento: pasta "dados" ao lado deste arquivo, no servidor ----------
   Um arquivo .json por registro (empresas, caixas, movimentacoes). Duas pessoas cadastrando ao mesmo tempo
   nunca sobrescrevem uma à outra. Edição do MESMO registro é protegida por número de revisão (rev). */
const COLS={emp:{dir:'empresas',pre:'emp'},cx:{dir:'caixas',pre:'cx'},mov:{dir:'movimentacoes',pre:'mov'}};
const D={emp:{},cx:{},mov:{}};
const FS={dados:null,cache:new Map(),busy:false,marker:null,last:0,ready:false,saved:null};
class Conflict extends Error{}
const sub=(n,c=true)=>FS.dados.getDirectoryHandle(n,{create:c});
async function writeFile(dir,name,obj){const fh=await dir.getFileHandle(name,{create:true}),txt=JSON.stringify(obj),w=await fh.createWritable();await w.write(txt);await w.close();
  if(await(await fh.getFile()).text()!==txt)throw new Error('A conferência da gravação falhou.');}
async function readJson(dir,name){return JSON.parse(await(await dir.getFileHandle(name)).getFile().then(f=>f.text()));}
async function touch(){try{const t=newId();await writeFile(await sub('config'),'alteracao.json',{t});FS.marker=t;}catch(e){console.warn(e);}}
async function save(col,rec,isNew){
  const c=COLS[col],dir=await sub(c.dir),name=c.pre+'_'+rec.id+'.json';
  if(!isNew){let disk;try{disk=await readJson(dir,name);}catch(e){if(e&&e.name==='NotFoundError')throw new Conflict('Este registro foi excluído por outra pessoa.');throw e;}
    if((disk.rev||0)!==(rec.rev||0))throw new Conflict('Este registro foi alterado por outra pessoa enquanto você editava.');}
  const out=Object.assign({},rec,{rev:(rec.rev||0)+1,atualizadoEm:Date.now()});
  await writeFile(dir,name,out);D[col][out.id]=out;await touch();return out;}
async function remove(col,rec){ /* move uma cópia para dados\lixeira antes de apagar */
  const c=COLS[col],dir=await sub(c.dir),name=c.pre+'_'+rec.id+'.json';let cur=rec;
  try{cur=await readJson(dir,name);}catch(e){if(!(e&&e.name==='NotFoundError'))throw e;}
  await writeFile(await sub('lixeira'),name,Object.assign({},cur,{_excluidoEm:Date.now()}));
  try{await dir.removeEntry(name);}catch(e){if(!(e&&e.name==='NotFoundError'))throw e;}
  delete D[col][rec.id];await touch();}
const sig=()=>Object.keys(COLS).map(k=>Object.values(D[k]).map(r=>r.id+':'+r.rev).sort().join(',')).join('|');
async function loadAll(force){
  if(!FS.dados||FS.busy)return;FS.busy=true;
  try{let m=null;try{m=(await readJson(await sub('config'),'alteracao.json')).t;}catch(e){}
    if(!force&&m&&m===FS.marker&&Date.now()-FS.last<120000){setMode();return;}
    const next={emp:{},cx:{},mov:{}};
    for(const col in COLS){const c=COLS[col],dir=await sub(c.dir);
      for await(const [name,hd] of dir.entries()){
        if(hd.kind!=='file'||name.indexOf(c.pre+'_')!==0||!/\.json$/.test(name))continue;
        const f=await hd.getFile(),key=c.dir+'/'+name;let ch=FS.cache.get(key);
        if(!ch||ch.t!==f.lastModified||ch.s!==f.size){try{ch={t:f.lastModified,s:f.size,v:JSON.parse(await f.text())};FS.cache.set(key,ch);}catch(e){continue;}}
        next[col][ch.v.id]=ch.v;}}
    const before=sig();D.emp=next.emp;D.cx=next.cx;D.mov=next.mov;FS.marker=m;FS.last=Date.now();
    setMode();if(before!==sig()||force)redraw();
  }catch(e){if(e&&e.name==='NotAllowedError'){FS.ready=false;showConnect('perm');}else $('mode').textContent='Sem acesso à pasta do servidor agora. Tentando de novo…';}
  finally{FS.busy=false;}}
function setMode(){const t=new Date();$('mode').textContent='Conectado à pasta do servidor · atualizado às '+pad(t.getHours())+':'+pad(t.getMinutes())+':'+pad(t.getSeconds());}
function guard(){if(!FS.ready){toast('Conecte à pasta do servidor primeiro.');showConnect('pick');return false;}return true;}
function fail(e){console.error(e);
  if(e instanceof Conflict){alert(e.message+'\nOs dados serão recarregados. Confira e refaça a alteração, se necessário.');closeM();loadAll(true);return;}
  if(e&&e.name==='NotAllowedError'){FS.ready=false;showConnect('perm');return;}
  alert('NÃO FOI SALVO.\nNão foi possível gravar na pasta do servidor. Confira se o Z: está acessível e tente de novo.\n\nDetalhe: '+(e&&e.message||e));}

/* ---------- dados derivados ---------- */
const locStr=c=>[c.sala&&'Sala '+c.sala,c.armario&&'Armário '+c.armario,c.estante&&'Estante '+c.estante,c.posicao&&'Posição '+c.posicao].filter(Boolean).join(' · ');
const vol=c=>c.vol?(c.vol+(c.volTotal?' de '+c.volTotal:'')):'';
const yrs=p=>(String(p||'').match(/\d{4}/g)||[]).map(Number);
const nCx=eid=>Object.values(D.cx).filter(c=>c.empresaId===eid).length;
const byCode=(a,b)=>a.codigo.localeCompare(b.codigo,'pt',{numeric:true});
const empName=e=>e?(e.razao+(e.fantasia?' ('+e.fantasia+')':'')):'(empresa excluída)';
const pill=s=>'<span class="pill s'+Math.max(0,SIT.indexOf(s))+'">'+esc(s)+'</span>';
const hay=c=>{const e=D.emp[c.empresaId]||{};return norm([c.codigo,e.razao,e.fantasia,e.cnpj,mask(e.cnpj),c.tipo,c.periodo,c.descricao,locStr(c),c.situacao,c.paradeiro,c.obs].join(' '));};
const filt=f=>Object.values(D.cx).filter(c=>{
  if(f.sit&&c.situacao!==f.sit)return false;if(f.tipo&&c.tipo!==f.tipo)return false;if(f.emp&&c.empresaId!==f.emp)return false;
  if(f.ano){const y=yrs(c.periodo),a=+f.ano;if(!y.length||a<Math.min(...y)||a>Math.max(...y))return false;}
  const h=hay(c);return norm(f.q).split(/\s+/).filter(Boolean).every(t=>h.includes(t));}).sort(byCode);
const dups=()=>{const m={};Object.values(D.cx).forEach(c=>{(m[norm(c.codigo)]=m[norm(c.codigo)]||[]).push(c.codigo);});return Object.values(m).filter(a=>a.length>1).map(a=>a[0]);};
const cxTable=l=>!l.length?'<p class="empty">Nenhuma caixa encontrada.</p>':'<div class="tw"><table class="t"><thead><tr><th>Código</th><th>Empresa</th><th>Tipo</th><th>Período</th><th>Localização</th><th>Situação</th></tr></thead><tbody>'+
  l.slice(0,300).map(c=>'<tr data-act="cx" data-id="'+c.id+'"><td><b>'+esc(c.codigo)+'</b>'+(vol(c)?'<div class="muted">cx '+esc(vol(c))+'</div>':'')+'</td><td>'+esc(empName(D.emp[c.empresaId]))+'</td><td>'+esc(c.tipo)+'</td><td>'+esc(c.periodo)+'</td><td>'+esc(locStr(c))+(c.paradeiro&&c.situacao!=='Armazenada'?'<div class="muted">com/para: '+esc(c.paradeiro)+'</div>':'')+'</td><td>'+pill(c.situacao)+'</td></tr>').join('')+'</tbody></table></div>'+(l.length>300?'<p class="muted">Mostrando 300 de '+l.length+'. Refine a pesquisa.</p>':'');
const movTable=(l,showCx)=>!l.length?'<p class="empty">Nenhuma movimentação.</p>':'<div class="tw"><table class="t"><thead><tr><th>Data/hora</th>'+(showCx?'<th>Caixa</th>':'')+'<th>Tipo</th><th>Responsável</th><th>Origem</th><th>Destino</th><th>Obs.</th></tr></thead><tbody>'+
  l.map(m=>'<tr><td>'+dtBR(m.dataHora)+'</td>'+(showCx?'<td><b>'+esc(m.codigo)+'</b><div class="muted">'+esc(m.empresa)+'</div></td>':'')+'<td>'+esc(m.tipo)+'</td><td>'+esc(m.responsavel)+'</td><td>'+esc(m.origem)+'</td><td>'+esc(m.destino)+'</td><td>'+esc(m.obs)+'</td></tr>').join('')+'</tbody></table></div>';
const movSort=(a,b)=>(a.dataHora+String(a.criadoEm||0).padStart(15,'0')).localeCompare(b.dataHora+String(b.criadoEm||0).padStart(15,'0'));

/* ---------- janelas ---------- */
function modal(h){$('mdBox').innerHTML=h;$('md').hidden=false;}
function closeM(){$('md').hidden=true;$('mdBox').innerHTML='';}

/* ---------- telas ---------- */
let cur='home',PF=null,REP=null;
const V={
home:{shell:()=>'<h1>Início</h1><div class="cards" id="cards"></div><div id="dupw"></div><div class="card"><h2>Pesquisa rápida</h2><input class="in" id="q" data-live placeholder="Código, empresa, CNPJ, descrição, localização…" autocomplete="off"><div id="res" style="margin-top:10px"></div></div><div class="card"><h2>Últimas movimentações</h2><div id="last"></div></div>',
  res(){const cx=Object.values(D.cx),n=s=>cx.filter(c=>c.situacao===s).length,k=(b,l,s)=>'<button class="k" '+(s?'data-act="goSit" data-s="'+s+'"':'data-act="go" data-v="'+b+'"')+'><b>'+(s?n(s):b==='emp'?Object.keys(D.emp).length:cx.length)+'</b><span>'+l+'</span></button>';
    $('cards').innerHTML=k('emp','Empresas')+k('cx','Caixas')+k('','Armazenadas','Armazenada')+k('','Retiradas','Retirada')+k('','Aguardando entrega','Aguardando entrega')+k('','Entregues','Entregue');
    const d=dups();$('dupw').innerHTML=d.length?'<div class="warn"><b>Atenção:</b> existem códigos de caixa duplicados ('+esc(d.join(', '))+'). Edite uma das caixas para corrigir.</div>':'';
    const q=$('q').value;$('res').innerHTML=T(q)?cxTable(filt({q}).slice(0,15)):'<p class="muted">Digite para localizar caixas.</p>';
    $('last').innerHTML=movTable(Object.values(D.mov).sort(movSort).reverse().slice(0,8),true);}},
cx:{shell(){const f=PF||{};PF=null;return '<h1>Caixas</h1><div class="card"><div class="g"><div style="grid-column:span 2"><label>Pesquisar</label><input class="in" id="fq" data-live placeholder="Código, empresa, CNPJ, descrição, localização…" autocomplete="off"></div><div><label>Situação</label><select id="fs" data-live>'+opt(SIT,f.sit,'Todas')+'</select></div><div><label>Tipo</label><select id="ft" data-live>'+opt(TIPOS,'','Todos')+'</select></div><div><label>Empresa</label><select id="fe" data-live><option value="">Todas</option>'+Object.values(D.emp).sort((a,b)=>a.razao.localeCompare(b.razao)).map(e=>'<option value="'+e.id+'">'+esc(e.razao)+'</option>').join('')+'</select></div><div><label>Ano</label><input class="in" id="fa" data-live inputmode="numeric" maxlength="4" placeholder="ex.: 2019"></div></div><div class="bar"><button class="btn pri" data-act="cxNew">+ Nova caixa</button></div></div><div class="card" id="res"></div>';},
  res(){const l=filt({q:$('fq').value,sit:$('fs').value,tipo:$('ft').value,emp:$('fe').value,ano:T($('fa').value)});$('res').innerHTML='<p class="muted">'+l.length+' caixa(s)</p>'+cxTable(l);}},
emp:{shell:()=>'<h1>Empresas</h1><div class="card"><div class="bar"><input class="in" id="eq" data-live placeholder="Pesquisar razão social, fantasia ou CNPJ…" style="max-width:420px" autocomplete="off"><span class="sp"></span><button class="btn pri" data-act="empNew">+ Nova empresa</button></div><div id="res"></div></div>',
  res(){const ts=norm($('eq').value).split(/\s+/).filter(Boolean),l=Object.values(D.emp).filter(e=>{const h=norm(e.razao+' '+e.fantasia+' '+e.cnpj+' '+mask(e.cnpj));return ts.every(t=>h.includes(t));}).sort((a,b)=>a.razao.localeCompare(b.razao));
    $('res').innerHTML=!l.length?'<p class="empty">Nenhuma empresa encontrada.</p>':'<div class="tw"><table class="t"><thead><tr><th>Razão social</th><th>Nome fantasia</th><th>CNPJ</th><th>Caixas</th></tr></thead><tbody>'+l.map(e=>'<tr data-act="emp" data-id="'+e.id+'"><td><b>'+esc(e.razao)+'</b></td><td>'+esc(e.fantasia)+'</td><td>'+esc(mask(e.cnpj))+'</td><td>'+nCx(e.id)+'</td></tr>').join('')+'</tbody></table></div>';}},
mov:{shell:()=>'<h1>Movimentações</h1><div class="card"><div class="bar"><input class="in" id="mq" data-live placeholder="Pesquisar caixa, empresa, responsável…" style="max-width:360px" autocomplete="off"><select id="mt" data-live style="max-width:220px">'+opt(['Cadastro'].concat(MOVS),'','Todos os tipos')+'</select><span class="sp"></span><button class="btn pri" data-act="mov">+ Registrar movimentação</button></div><div id="res"></div></div>',
  res(){const ts=norm($('mq').value).split(/\s+/).filter(Boolean),t=$('mt').value,l=Object.values(D.mov).filter(m=>(!t||m.tipo===t)&&ts.every(x=>norm([m.codigo,m.empresa,m.responsavel,m.origem,m.destino,m.obs].join(' ')).includes(x))).sort(movSort).reverse();
    $('res').innerHTML='<p class="muted">'+l.length+' movimentação(ões)'+(l.length>400?' — mostrando 400':'')+'</p>'+movTable(l.slice(0,400),true);}},

async function subMov(f){const v=Object.fromEntries(new FormData(f)),fe=$('fe'),t=v.tipo;if(!guard())return;

  async get(k){try{const db=await this.open();return await new Promise(ok=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(null);});}catch(e){return null;}},
  async set(k,v){try{const db=await this.open();db.transaction('kv','readwrite').objectStore('kv').put(v,k);}catch(e){}}};
function diag(x){$('cxDiag').textContent='Diagnóstico: '+navigator.userAgent.slice(0,70)+' · seletor de pasta: '+(typeof window.showDirectoryPicker==='function'?'sim':'não')+' · '+decodeURI(location.href)+(x?' · '+x:'');}
function showConnect(kind){$('cx').hidden=false;diag();const b=$('cxBtn'),t=$('cxTxt');$('cxErr').textContent='';
  if(kind==='nosupport'){t.textContent='Este navegador não consegue gravar na pasta do servidor. Abra o arquivo "Arquivo Morto" no Google Chrome ou no Microsoft Edge.';b.hidden=true;return;}
  b.hidden=false;b.dataset.kind=kind||'pick';
  if(kind==='perm'){t.textContent='O navegador pede uma confirmação para voltar a usar a pasta do Arquivo Morto no servidor.';b.textContent='Continuar';}
  else{t.textContent='Na primeira vez em cada computador, escolha a pasta "Arquivo Morto" no servidor (a mesma pasta onde está este arquivo) e clique em "Permitir" para editar.';b.textContent='Escolher a pasta do Arquivo Morto';}}
async function useRoot(root){
  let mine=false;for await(const [n,h] of root.entries()){if(h.kind==='file'&&/arquivo.*morto.*\.html?$/i.test(n))mine=true;}
  if(!mine){$('cxErr').textContent='Essa não é a pasta do Arquivo Morto. Escolha a pasta onde fica o arquivo "Arquivo Morto.html".';return false;}
  FS.dados=await root.getDirectoryHandle('dados',{create:true});
  for(const k of['empresas','caixas','movimentacoes','config','lixeira'])await sub(k);
  const cfg=await sub('config');try{await cfg.getFileHandle('sistema.json');}catch(e){if(e&&e.name==='NotFoundError')await writeFile(cfg,'sistema.json',{app:'arquivo-morto',versao:1,criadoEm:Date.now()});else throw e;}
  await IDB.set('pasta',root);$('cx').hidden=true;FS.ready=true;await loadAll(true);go(cur);return true;}
$('cxBtn').addEventListener('click', async () => {
  const b = $('cxBtn');
  const kind = b.dataset.kind;

  if (b.disabled) return;

  b.disabled = true;
  $('cxErr').textContent = '';
  b.textContent = 'Conectando...';

  try {
    if (kind === 'perm' && FS.saved) {
      try {
        const permission = await FS.saved.requestPermission({
          mode: 'readwrite'
        });

        if (permission === 'granted') {
          if (await useRoot(FS.saved)) return;
        }
      } catch (err) {
        if (err && err.name === 'NotFoundError') {
          /* a pasta guardada de antes foi movida/renomeada: esquecer e pedir de novo */
          FS.saved = null;
          await IDB.set('pasta', null);
          b.dataset.kind = 'pick';
          $('cxTxt').textContent = 'Na primeira vez em cada computador, escolha a pasta "Arquivo Morto" no servidor (a mesma pasta onde está este arquivo) e clique em "Permitir" para editar.';
          $('cxErr').textContent = 'A pasta usada antes não foi encontrada (foi movida ou renomeada). Clique de novo no botão e escolha a pasta atual.';
          return;
        }
        throw err;
      }
    }

    if (typeof window.showDirectoryPicker !== 'function') {
      throw new Error(
        'Este navegador não oferece suporte à seleção de pastas.'
      );
    }

    const root = await window.showDirectoryPicker({
      id: 'arquivo-morto',
      mode: 'readwrite'
    });

    const permission = await root.requestPermission({
      mode: 'readwrite'
    });

    if (permission !== 'granted') {
      $('cxErr').textContent =
        'Permissão de edição não concedida. Tente novamente.';
      return;
    }

    await useRoot(root);

  } catch (e) {
    console.error('Erro ao conectar a pasta:', e);
    diag((e && e.name) + ': ' + (e && e.message));

    if (e && e.name === 'AbortError') {
      $('cxErr').textContent =
        'A seleção da pasta foi cancelada ou interrompida. ' +
        'Tente novamente. Se o erro continuar, pode haver uma ' +
        'restrição do navegador ou da pasta de rede.';
    } else if (e && e.name === 'NotFoundError') {
      $('cxErr').textContent =
        'Pasta ou arquivo não encontrado. Escolha a pasta que contém o arquivo "Arquivo Morto.html" e a pasta "dados" (não a subpasta "Arquivo Morto").';
    } else if (e && e.name === 'SecurityError') {
      $('cxErr').textContent =
        'O navegador bloqueou o acesso à pasta. Verifique as ' +
        'políticas de segurança da empresa.';
    } else {
      $('cxErr').textContent =
        'Não foi possível conectar à pasta: ' +
        (e && e.message ? e.message : String(e));
    }

  } finally {
    b.disabled = false;
    b.textContent =
      b.dataset.kind === 'perm'
        ? 'Continuar'
        : 'Escolher a pasta do Arquivo Morto';
  }
});

/* ---------- início ---------- */
go('home');
(async()=>{
  if(typeof window.showDirectoryPicker!=='function'){showConnect('nosupport');return;}
  const saved=await IDB.get('pasta');FS.saved=saved;
  if(saved){try{if(await saved.queryPermission({mode:'readwrite'})==='granted'){if(await useRoot(saved))return;}}catch(e){if(e&&e.name==='NotFoundError'){FS.saved=null;IDB.set('pasta',null);showConnect('pick');$('cxErr').textContent='A pasta usada antes não foi encontrada (foi movida ou renomeada). Escolha a pasta de novo.';return;}}showConnect('perm');return;}
  showConnect('pick');})();
setInterval(()=>{if(FS.ready&&!document.hidden)loadAll(false);},10000);
document.addEventListener('visibilitychange',()=>{if(FS.ready&&!document.hidden)loadAll(false);});
})();
</script>
